name: Update profile cards

on:
  push:
    paths:
      - ".github/workflows/profile-cards.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate public stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_title=true&hide_border=true&hide_rank=true&hide=prs,issues,contribs&theme=github_dark&bg_color=0d1117&title_color=a3e635&icon_color=a3e635
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: assets/contribution-snake.svg?palette=github-dark&color_snake=a3e635

      - name: Commit profile graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/contribution-snake.svg
          git commit -m "Update profile graphics" || exit 0
          git push
